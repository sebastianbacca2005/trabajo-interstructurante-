<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CulturaActiva Pasto - Iniciar sesión</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        /* PÁGINA WEB */

        .pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px;
            background: #eeeeee;
        }

        .contenedor-web {
            width: 100%;
            max-width: 1100px;
            min-height: 650px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            background: #fff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        /* PANEL IZQUIERDO */

        .panel-marca {
            background: #51006f;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 55px;
        }

        .logo {
            width: 280px;
            height: 210px;
            object-fit: contain;
            display: block;
            margin-bottom: 5px;
        }

        .nombre {
            font-size: 45px;
            font-weight: 700;
            line-height: 1;
            margin-top: 0;
        }

        .cultura {
            color: #fff;
        }

        .activa {
            color: #f08a2b;
        }

        .pasto {
            margin-top: 10px;
            padding-left: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 13px;
        }

        .descripcion {
            margin-top: 18px;
            max-width: 400px;
            font-size: 15px;
            line-height: 1.5;
            color: #eadcf0;
        }

        /* PANEL DERECHO */

        .panel-login {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 55px;
            background: #fff;
        }

        .formulario {
            width: 100%;
            max-width: 430px;
        }

        .formulario h1 {
            margin: 0;
            color: #28105f;
            font-size: 30px;
        }

        .subtitulo {
            margin-top: 8px;
            margin-bottom: 32px;
            color: #666;
            font-size: 14px;
        }

        .campo {
            width: 100%;
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .campo input {
            width: 100%;
            height: 46px;
            padding: 10px 13px;
            border: 1px solid #9b9b9b;
            border-radius: 4px;
            background: #f3f3f3;
            color: #222;
            font-size: 14px;
            outline: none;
        }

        .campo input:focus {
            border: 2px solid #563b94;
            background: #fff;
        }

        .btn-login {
            display: block;
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 4px;
            background: #563b94;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #452f7a;
        }

        .recuperar {
            display: block;
            margin-top: 18px;
            text-align: right;
            color: #563b94;
            font-size: 13px;
            text-decoration: none;
        }

        .recuperar:hover {
            text-decoration: underline;
        }

        .separador {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 28px 0 22px;
        }

        .linea {
            flex: 1;
            border-top: 1px solid #d3c9df;
        }

        .punto {
            width: 7px;
            height: 7px;
            border: 2px solid #563b94;
            border-radius: 50%;
            margin: 0 12px;
        }

        .registro {
            display: flex;
            justify-content: center;
            gap: 5px;
            font-size: 13px;
            color: #444;
        }

        .registro a {
            color: #28105f;
            font-weight: 700;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        .alerta {
            width: 100%;
            padding: 11px 13px;
            margin-bottom: 18px;
            background: #ffdddd;
            border-left: 5px solid #f44336;
            color: #a94442;
            font-size: 13px;
            text-align: center;
        }

        /* TABLET */

        @media (max-width: 900px) {

            .pagina {
                padding: 25px;
            }

            .contenedor-web {
                grid-template-columns: 1fr;
                max-width: 700px;
            }

            .panel-marca {
                padding: 40px 30px;
                min-height: 330px;
            }

            .logo {
                width: 220px;
                height: 155px;
            }

            .nombre {
                font-size: 36px;
            }

            .pasto {
                font-size: 16px;
            }

            .panel-login {
                padding: 38px 32px;
            }

        }

        /* CELULAR */

        @media (max-width: 520px) {

            .pagina {
                padding: 0;
            }

            .contenedor-web {
                min-height: 100vh;
                box-shadow: none;
            }

            .panel-marca {
                min-height: 300px;
                padding: 35px 20px;
            }

            .logo {
                width: 210px;
                height: 145px;
            }

            .nombre {
                font-size: 34px;
            }

            .pasto {
                font-size: 15px;
                letter-spacing: 11px;
            }

            .descripcion {
                font-size: 13px;
            }

            .panel-login {
                padding: 30px 22px 40px;
            }

            .formulario h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

<div class="pagina">

    <div class="contenedor-web">

        <!-- MARCA -->

        <section class="panel-marca">

            <img
                src="../imagen/usuario.png"
                alt="CulturaActiva Pasto"
                class="logo"
            >

            <div class="nombre">

                <span class="cultura">Cultura</span><span class="activa">Activa</span>

            </div>

            <div class="pasto">
                PASTO
            </div>

            <p class="descripcion">
                Conecta con la cultura, vive tu ciudad.
            </p>

        </section>

        <!-- LOGIN -->

        <section class="panel-login">

            <div class="formulario">

                <h1>Iniciar sesión</h1>

                <p class="subtitulo">
                    Ingresa a CulturaActiva Pasto para continuar.
                </p>

                <div id="mensaje"></div>

                <form
                    name="Login-Form"
                    action="signin.php"
                    method="POST"
                >

                    <div class="campo">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Iniciar sesión
                    </button>

                </form>

                <a
                    href="recuperar.html"
                    class="recuperar"
                >
                    ¿Olvidaste tu contraseña?
                </a>

                <div class="separador">

                    <div class="linea"></div>

                    <div class="punto"></div>

                    <div class="linea"></div>

                </div>

                <div class="registro">

                    <span>
                        ¿No tienes cuenta?
                    </span>

                    <a href="registro.html">
                        Registrarse
                    </a>

                </div>

            </div>

        </section>

    </div>

</div>

<script>

    const parametros =
        new URLSearchParams(window.location.search);

    const error =
        parametros.get("error");

    const mensaje =
        document.getElementById("mensaje");

    if (error) {

        let texto = "";

        if (error === "usuario_no_encontrado") {

            texto = "❌ Usuario no encontrado";

        } else if (error === "contrasena_incorrecta") {

            texto = "⚠️ Contraseña incorrecta";

        } else if (error === "campos_vacios") {

            texto = "⚠️ Complete todos los campos";

        } else if (error === "conexion") {

            texto =
                "❌ Error de conexión con la base de datos";

        }

        if (texto !== "") {

            mensaje.innerHTML =
                '<div class="alerta">' +
                texto +
                '</div>';

        }

    }

</script>

</body>

</html>
