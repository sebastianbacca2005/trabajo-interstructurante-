<header>
    <img src="../imagen/usuario.png" alt="CulturaActiva Pasto" class="logo">
</header>

<div class="contenedor">

    <a href="principal.php" class="volver">
        ← Volver
    </a>

    <h1>Crear evento</h1>

    <div id="mensaje" class="mensaje"></div>

    <form
        action="crear_evento.php"
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="campo">
            <label for="titulo">Nombre del evento</label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Ej: Festival de música"
                required
            >
        </div>

        <div class="campo">
            <label for="descripcion">Descripción</label>

            <textarea
                id="descripcion"
                name="descripcion"
                placeholder="Describe el evento..."
                required
            ></textarea>
        </div>

        <div class="campo">
            <label for="fecha">Fecha</label>

            <input
                type="date"
                id="fecha"
                name="fecha"
                required
            >
        </div>

        <div class="campo">
            <label for="hora">Hora</label>

            <input
                type="time"
                id="hora"
                name="hora"
                required
            >
        </div>

        <div class="campo">
            <label for="imagen">Imagen del evento</label>

            <input
                type="file"
                id="imagen"
                name="imagen"
                accept=".jpg,.jpeg,.png,.webp"
            >
        </div>

        <div class="campo">

            <label>Selecciona el lugar del evento en el mapa</label>

            <div id="mapa"></div>

            <p class="indicacion">
                📍 Haz clic sobre el mapa para colocar la ubicación exacta del evento.
            </p>

            <div class="coordenadas">
                Latitud:
                <span id="mostrarLatitud">No seleccionada</span>
                <br>

                Longitud:
                <span id="mostrarLongitud">No seleccionada</span>
            </div>

            <input
                type="hidden"
                id="latitud"
                name="latitud"
            >

            <input
                type="hidden"
                id="longitud"
                name="longitud"
            >

        </div>

        <button type="submit" class="boton">
            Publicar evento
        </button>

    </form>

</div>

<!-- Leaflet -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    // Coordenadas aproximadas del centro de Pasto

    const pastoLat = 1.2136;
    const pastoLng = -77.2811;

    const mapa = L.map("mapa").setView(
        [pastoLat, pastoLng],
        14
    );

    // Mapa real de OpenStreetMap

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(mapa);

    let marcador = null;

    mapa.on("click", function(evento) {

        const lat = evento.latlng.lat;
        const lng = evento.latlng.lng;

        // Si ya existe un marcador, lo quitamos

        if (marcador !== null) {
            mapa.removeLayer(marcador);
        }

        // Crear nuevo marcador

        marcador = L.marker([lat, lng])
            .addTo(mapa)
            .bindPopup("Ubicación del evento")
            .openPopup();

        // Guardar coordenadas

        document.getElementById("latitud").value = lat.toFixed(7);
        document.getElementById("longitud").value = lng.toFixed(7);

        // Mostrar coordenadas

        document.getElementById("mostrarLatitud").textContent =
            lat.toFixed(7);

        document.getElementById("mostrarLongitud").textContent =
            lng.toFixed(7);
    });

    // Mensajes de error

    const parametros = new URLSearchParams(
        window.location.search
    );

    const error = parametros.get("error");

    if (error) {

        const mensaje = document.getElementById("mensaje");

        mensaje.style.display = "block";

        if (error === "campos_vacios") {
            mensaje.textContent =
                "Debes completar todos los campos.";
        }

        if (error === "ubicacion") {
            mensaje.textContent =
                "Debes seleccionar una ubicación en el mapa.";
        }

        if (error === "imagen") {
            mensaje.textContent =
                "La imagen no pudo ser cargada.";
        }
    }

</script>
