<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - CulturaActiva Pasto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 25px 42px;
        }

        .volver {
            display: inline-block;
            font-size: 32px;
            text-decoration: none;
            color: #222222;
            margin-bottom: 5px;
        }

        .logo {
            display: block;
            width: 180px;
            margin: 0 auto 35px auto;
        }

        h1 {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .descripcion {
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 35px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            height: 35px;
            background: #dddddd;
            border: 1px solid #777777;
            padding: 5px 8px;
            font-size: 14px;
        }

        .boton {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            background: #4b006f;
            color: white;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .boton:hover {
            background: #390052;
        }

        #mensaje {
            text-align: center;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .error {
            color: #b00020;
        }

        .exito {
            color: #4b006f;
        }

        .separador {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 28px 10px 18px;
        }

        .linea {
            height: 1px;
            background: #8b6bb0;
            flex: 1;
        }

        .circulo {
            color: #4b006f;
            font-size: 12px;
        }

        .registro {
            text-align: center;
            font-size: 13px;
        }

        .registro a {
            color: #4b006f;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <a href="signin.html" class="volver">←</a>

        <img
            src="../imagen/usuario.png"
            alt="CulturaActiva Pasto"
            class="logo"
        >

        <h1>Encuentra tu cuenta</h1>

        <div class="descripcion">
            Ingresa el correo electrónico asociado a tu cuenta
            para recuperar tu contraseña.
        </div>

        <!-- Mensaje de error o éxito -->
        <div id="mensaje"></div>

        <form action="recuperar.php" method="POST">

            <div class="campo">
                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >
            </div>

            <button type="submit" class="boton">
                Continuar
            </button>

        </form>

        <div class="separador">
            <div class="linea"></div>
            <div class="circulo">°</div>
            <div class="linea"></div>
        </div>

        <div class="registro">
            ¿No tienes una cuenta?
            <a href="registro.html">Registrarse</a>
        </div>

    </div>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const mensaje = document.getElementById("mensaje");

        if (parametros.get("error") === "correo_no_encontrado") {
            mensaje.innerHTML =
                "El correo no está vinculado a una cuenta.";
            mensaje.className = "error";
        }

        if (parametros.get("error") === "correo_vacio") {
            mensaje.innerHTML =
                "Por favor, ingresa tu correo electrónico.";
            mensaje.className = "error";
        }

        if (parametros.get("error") === "conexion") {
            mensaje.innerHTML =
                "Ocurrió un error. Inténtalo nuevamente.";
            mensaje.className = "error";
        }

        if (parametros.get("error") === "registro_codigo") {
            mensaje.innerHTML =
                "No se pudo generar el código. Inténtalo nuevamente.";
            mensaje.className = "error";
        }

        if (parametros.get("enviado") === "1") {
            mensaje.innerHTML =
                "Se ha enviado un código de recuperación a tu correo.";
            mensaje.className = "exito";
        }
    </script>

</body>
</html>
